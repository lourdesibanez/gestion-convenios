
services:
  db_convenios:
    image: mysql:8.0
    container_name: mysql_convenios
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: gestion-convenio
    ports:
      - "3307:3306"
    volumes:
      - convenios_data:/var/lib/mysql

volumes:
  convenios_data:
